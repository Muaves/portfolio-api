<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'MS Sans Serif', Arial, sans-serif;
            background: #008080;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .window {
            max-width: 500px;
            background: #c0c0c0;
            border: 2px solid;
            border-color: #ffffff #000000 #000000 #ffffff;
            box-shadow: 2px 2px 0 #000000;
        }

        .title-bar {
            background: linear-gradient(to right, #000080, #1084d0);
            color: white;
            padding: 3px;
            font-weight: bold;
            font-size: 14px;
            padding-left: 5px;
        }

        .content {
            padding: 30px;
        }

        h1 {
            color: #000080;
            margin-bottom: 20px;
            font-size: 24px;
        }

        .info {
            background: white;
            border: 2px solid;
            border-color: #808080 #ffffff #ffffff #808080;
            padding: 15px;
            margin-bottom: 20px;
            line-height: 1.6;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 5px;
            border: 2px solid;
            border-color: #808080 #ffffff #ffffff #808080;
            font-family: 'MS Sans Serif', Arial, sans-serif;
            font-size: 14px;
        }

        .button {
            background: #c0c0c0;
            border: 2px solid;
            border-color: #ffffff #000000 #000000 #ffffff;
            padding: 8px 20px;
            cursor: pointer;
            font-family: 'MS Sans Serif', Arial, sans-serif;
            font-size: 14px;
            width: 100%;
            margin-top: 10px;
        }

        .button:active {
            border-color: #000000 #ffffff #ffffff #000000;
        }

        .error {
            background: #ff0000;
            color: white;
            padding: 10px;
            margin-top: 15px;
            border: 2px solid #800000;
            display: none;
        }

        /* Admin Panel */
        #adminPanel {
            display: none;
        }

        .admin-window {
            max-width: 1000px;
            margin: 0 auto;
        }

        .menu-bar {
            background: #c0c0c0;
            padding: 2px;
            border-bottom: 2px solid #ffffff;
        }

        .menu-item {
            display: inline-block;
            padding: 4px 8px;
            cursor: pointer;
        }

        .menu-item:hover {
            background: #000080;
            color: white;
        }

        .admin-content {
            background: white;
            padding: 20px;
            min-height: 500px;
            border: 2px solid;
            border-color: #808080 #ffffff #ffffff #808080;
            margin: 2px;
        }

        .stat-box {
            background: #c0c0c0;
            border: 2px solid;
            border-color: #ffffff #000000 #000000 #ffffff;
            padding: 20px;
            text-align: center;
            display: inline-block;
            margin: 10px;
            min-width: 150px;
        }

        .stat-number {
            font-size: 32px;
            font-weight: bold;
            color: #000080;
        }

        .project-item {
            background: #c0c0c0;
            border: 2px solid;
            border-color: #ffffff #000000 #000000 #ffffff;
            padding: 15px;
            margin: 10px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .success {
            background: #00ff00;
            padding: 10px;
            margin: 10px 0;
            border: 2px solid #008000;
            display: none;
        }
    </style>
</head>

<body><!-- belpes -->
    <div id="loginScreen">
        <div class="window">
            <div class="title-bar">Admin Login Required</div>
            <div class="content">
                <h1>Enter Credentials</h1>
                <div class="info"><strong>TWO-FACTOR AUTHENTICATION</strong><br>Both password AND secret key are
                    required.</div>
                <div class="form-group"><label>Password:</label><input type="password" id="passwordInput"
                        onkeypress="if(event.key==='Enter') document.getElementById('secretInput').focus()"></div>
                <div class="form-group"><label>Secret Key:</label><input type="password" id="secretInput"
                        onkeypress="if(event.key==='Enter') login()"></div><button class="button"
                    onclick="login()">LOGIN</button>
                <div id="errorMsg" class="error">INVALID CREDENTIALS</div>
            </div>
        </div>
    </div><!-- Admin szar  -->
    <div id="adminPanel">
        <div class="window admin-window">
            <div class="title-bar">Admin Panel - Muaves Portfolio</div>
            <div class="menu-bar"><span class="menu-item" onclick="logout()">Logout</span><span class="menu-item"
                    onclick="location.href='index.html'">View Site</span></div>
            <div class="admin-content">
                <h1>Dashboard</h1>
                <div id="successMsg" class="success"></div>
                <div id="statsContainer"></div>
                <h2 style="margin-top: 30px;">Add New Project</h2>
                <form id="addProjectForm">
                    <div class="form-group"><label>Name:</label><input type="text" id="projectName" required></div>
                    <div class="form-group"><label>Description:</label><input type="text" id="projectDescription"
                            required></div>
                    <div class="form-group"><label>Tech:</label><input type="text" id="projectTech" required></div>
                    <div class="form-group"><label>Status:</label><input type="text" id="projectStatus" required></div>
                    <button type="submit" class="button">ADD PROJECT</button>
                </form>
                <h2 style="margin-top: 30px;">All Projects</h2>
                <div id="projectsList"></div>
                <h2 style="margin-top: 30px;">Add New Link</h2>
                <form id="addLinkForm">
                    <div class="form-group"><label>Name:</label><input type="text" id="linkName" required></div>
                    <div class="form-group"><label>URL:</label><input type="text" id="linkUrl" required></div><button
                        type="submit" class="button">ADD LINK</button>
                </form>
            </div>
        </div>
    </div>
    <script>const API_URL = window.location.hostname === 'localhost' ? 'http://localhost:5000/api' : 'https://muaves-portfolio-api.onrender.com/api';// jelszav hashs (SHA-256 of "admin123")const PASSWORD_HASH = '240be518fabd2724ddb6f04eeb1da5967448d7e831c08c8fa822809f74c720a9';// titkos kulcs hash (SHA-256 of "mysecret456") - CHANGE THIS!const SECRET_HASH = 'a665a45920422f9d417e4867efdc4fb8a04a1f3fff1fa07e998e86f7f7a27ae3';// osszeszart hash (used for API)let AUTH_HASH = '';async function hashText(text) {const encoder = new TextEncoder();const data = encoder.encode(text);const hashBuffer = await crypto.subtle.digest('SHA-256', data);const hashArray = Array.from(new Uint8Array(hashBuffer));return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');}async function login() {const password = document.getElementById('passwordInput').value;const secret = document.getElementById('secretInput').value;const passwordHash = await hashText(password);const secretHash = await hashText(secret);if (passwordHash === PASSWORD_HASH && secretHash === SECRET_HASH) {// Create combined auth hashAUTH_HASH = await hashText(passwordHash + secretHash);sessionStorage.setItem('adminAuth', AUTH_HASH);document.getElementById('loginScreen').style.display = 'none';document.getElementById('adminPanel').style.display = 'block';loadDashboard();} else {const errorMsg = document.getElementById('errorMsg');errorMsg.style.display = 'block';setTimeout(() => errorMsg.style.display = 'none', 3000);}}function logout() {sessionStorage.removeItem('adminAuth');location.reload();}window.addEventListener('DOMContentLoaded', () => {const storedAuth = sessionStorage.getItem('adminAuth');if (storedAuth) {AUTH_HASH = storedAuth;document.getElementById('loginScreen').style.display = 'none';document.getElementById('adminPanel').style.display = 'block';loadDashboard();}});async function loadDashboard() {try {const response = await fetch(`${API_URL}/admin/stats`, {headers: { 'X-Auth-Hash': AUTH_HASH }});if (response.status === 401) {logout();return;}const stats = await response.json();document.getElementById('statsContainer').innerHTML = `<div class="stat-box"><div class="stat-number">${stats.projects.total}</div><div>Total Projects</div></div><div class="stat-box"><div class="stat-number">${stats.projects.completed}</div><div>Completed</div></div><div class="stat-box"><div class="stat-number">${stats.links.total}</div><div>Links</div></div><div class="stat-box"><div class="stat-number">${stats.views.total_visits}</div><div>Visits</div></div>`;await loadProjects();} catch (error) {console.error('Error:', error);}}async function loadProjects() {const response = await fetch(`${API_URL}/projects`);const projects = await response.json();document.getElementById('projectsList').innerHTML = projects.map((p, i) => `<div class="project-item"><div><strong>${p.name}</strong><br>${p.description}<br><small>Tech: ${p.tech} | Status: ${p.status}</small></div><button class="button" onclick="deleteProject(${i + 1}, '${p.name}')" style="width: auto;">DELETE</button></div>`).join('');}document.getElementById('addProjectForm').addEventListener('submit', async (e) => {e.preventDefault();const project = {name: document.getElementById('projectName').value,description: document.getElementById('projectDescription').value,tech: document.getElementById('projectTech').value,status: document.getElementById('projectStatus').value};try {await fetch(`${API_URL}/projects`, {method: 'POST',headers: {'Content-Type': 'application/json','X-Auth-Hash': AUTH_HASH},body: JSON.stringify(project)});showSuccess('PROJECT ADDED');document.getElementById('addProjectForm').reset();loadDashboard();} catch (error) {showSuccess('ERROR');}});document.getElementById('addLinkForm').addEventListener('submit', async (e) => {e.preventDefault();const link = {name: document.getElementById('linkName').value,url: document.getElementById('linkUrl').value};try {await fetch(`${API_URL}/links`, {method: 'POST',headers: {'Content-Type': 'application/json','X-Auth-Hash': AUTH_HASH},body: JSON.stringify(link)});showSuccess('LINK ADDED');document.getElementById('addLinkForm').reset();loadDashboard();} catch (error) {showSuccess('ERROR');}});async function deleteProject(id, name) {if (!confirm('Delete "' + name + '"?')) return;try {await fetch(`${API_URL}/projects/${id}`, {method: 'DELETE',headers: { 'X-Auth-Hash': AUTH_HASH }});showSuccess('DELETED');loadDashboard();} catch (error) {showSuccess('ERROR');}}function showSuccess(msg) {const el = document.getElementById('successMsg');el.textContent = msg;el.style.display = 'block';setTimeout(() => el.style.display = 'none', 3000);}</script>
</body>

</html>
