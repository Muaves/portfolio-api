<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'MS Sans Serif', Arial, sans-serif;
            background: #008080;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .window {
            max-width: 500px;
            background: #c0c0c0;
            border: 2px solid;
            border-color: #ffffff #000000 #000000 #ffffff;
            box-shadow: 2px 2px 0 #000000;
        }

        .title-bar {
            background: linear-gradient(to right, #000080, #1084d0);
            color: white;
            padding: 3px;
            font-weight: bold;
            font-size: 14px;
            padding-left: 5px;
        }

        .content {
            padding: 30px;
        }

        h1 {
            color: #000080;
            margin-bottom: 20px;
            font-size: 24px;
        }

        .info {
            background: white;
            border: 2px solid;
            border-color: #808080 #ffffff #ffffff #808080;
            padding: 15px;
            margin-bottom: 20px;
            line-height: 1.6;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 5px;
            border: 2px solid;
            border-color: #808080 #ffffff #ffffff #808080;
            font-family: 'MS Sans Serif', Arial, sans-serif;
            font-size: 14px;
        }

        .button {
            background: #c0c0c0;
            border: 2px solid;
            border-color: #ffffff #000000 #000000 #ffffff;
            padding: 8px 20px;
            cursor: pointer;
            font-family: 'MS Sans Serif', Arial, sans-serif;
            font-size: 14px;
            width: 100%;
            margin-top: 10px;
        }

        .button:active {
            border-color: #000000 #ffffff #ffffff #000000;
        }

        .error {
            background: #ff0000;
            color: white;
            padding: 10px;
            margin-top: 15px;
            border: 2px solid #800000;
            display: none;
        }

        /* Admin Panel */
        #adminPanel {
            display: none;
        }

        .admin-window {
            max-width: 1000px;
            margin: 0 auto;
        }

        .menu-bar {
            background: #c0c0c0;
            padding: 2px;
            border-bottom: 2px solid #ffffff;
        }

        .menu-item {
            display: inline-block;
            padding: 4px 8px;
            cursor: pointer;
        }

        .menu-item:hover {
            background: #000080;
            color: white;
        }

        .admin-content {
            background: white;
            padding: 20px;
            min-height: 500px;
            border: 2px solid;
            border-color: #808080 #ffffff #ffffff #808080;
            margin: 2px;
        }

        .stat-box {
            background: #c0c0c0;
            border: 2px solid;
            border-color: #ffffff #000000 #000000 #ffffff;
            padding: 20px;
            text-align: center;
            display: inline-block;
            margin: 10px;
            min-width: 150px;
        }

        .stat-number {
            font-size: 32px;
            font-weight: bold;
            color: #000080;
        }

        .project-item {
            background: #c0c0c0;
            border: 2px solid;
            border-color: #ffffff #000000 #000000 #ffffff;
            padding: 15px;
            margin: 10px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .success {
            background: #00ff00;
            padding: 10px;
            margin: 10px 0;
            border: 2px solid #008000;
            display: none;
        }
    </style>
</head>

<body><!-- belpes -->
    <div id="loginScreen">
        <div class="window">
            <div class="title-bar">Admin Login Required</div>
            <div class="content">
                <h1>Enter Credentials</h1>
                <div class="info"><strong>TWO-FACTOR AUTHENTICATION</strong><br>Both password AND secret key are
                    required.</div>
                <div class="form-group"><label>Password:</label><input type="password" id="passwordInput"
                        onkeypress="if(event.key==='Enter') document.getElementById('secretInput').focus()"></div>
                <div class="form-group"><label>Secret Key:</label><input type="password" id="secretInput"
                        onkeypress="if(event.key==='Enter') login()"></div><button class="button"
                    onclick="login()">LOGIN</button>
                <div id="errorMsg" class="error">INVALID CREDENTIALS</div>
            </div>
        </div>
    </div><!-- Admin szar  -->
    <div id="adminPanel">
        <div class="window admin-window">
            <div class="title-bar">Admin Panel - Muaves Portfolio</div>
            <div class="menu-bar"><span class="menu-item" onclick="logout()">Logout</span><span class="menu-item"
                    onclick="location.href='index.html'">View Site</span></div>
            <div class="admin-content">
                <h1>Dashboard</h1>
                <div id="successMsg" class="success"></div>
                <div id="statsContainer"></div>
                <h2 style="margin-top: 30px;">Add New Project</h2>
                <form id="addProjectForm">
                    <div class="form-group"><label>Name:</label><input type="text" id="projectName" required></div>
                    <div class="form-group"><label>Description:</label><input type="text" id="projectDescription"
                            required></div>
                    <div class="form-group"><label>Tech:</label><input type="text" id="projectTech" required></div>
                    <div class="form-group"><label>Status:</label><input type="text" id="projectStatus" required></div>
                    <button type="submit" class="button">ADD PROJECT</button>
                </form>
                <h2 style="margin-top: 30px;">All Projects</h2>
                <div id="projectsList"></div>
                <h2 style="margin-top: 30px;">Add New Link</h2>
                <form id="addLinkForm">
                    <div class="form-group"><label>Name:</label><input type="text" id="linkName" required></div>
                    <div class="form-group"><label>URL:</label><input type="text" id="linkUrl" required></div><button
                        type="submit" class="button">ADD LINK</button>
                </form>
            </div>
        </div>
    </div>
    <script src="src/admin.js"></script>
</body>

</html>
