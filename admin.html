<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADMIN - Muaves Portfolio</title>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Courier New', monospace;
            background: linear-gradient(135deg, #1a0000 0%, #330000 100%);
            color: #ff0000;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        
        /* LOGIN SCREEN */
        #loginScreen {
            background: #000;
            border: 3px solid #ff0000;
            box-shadow: 0 0 30px rgba(255, 0, 0, 0.3);
            padding: 50px;
            text-align: center;
            max-width: 500px;
            margin: 100px auto;
        }
        
        #loginScreen h1 {
            color: #ff0000;
            font-size: 2.5em;
            margin-bottom: 30px;
            text-shadow: 0 0 10px #ff0000;
        }
        
        .login-input {
            width: 100%;
            padding: 15px;
            background: #1a0000;
            border: 2px solid #ff0000;
            color: #ff0000;
            font-family: 'Courier New', monospace;
            font-size: 1.2em;
            margin-bottom: 20px;
        }
        
        .login-btn {
            background: #000;
            color: #ff0000;
            border: 2px solid #ff0000;
            padding: 15px 40px;
            font-family: 'Courier New', monospace;
            font-size: 1.2em;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .login-btn:hover {
            background: #ff0000;
            color: #000;
            box-shadow: 0 0 20px #ff0000;
        }
        
        .error-msg {
            color: #ff0000;
            margin-top: 20px;
            display: none;
        }
        
        /* ADMIN PANEL */
        #adminPanel {
            display: none;
        }
        
        .header {
            background: #000;
            border: 3px solid #ff0000;
            padding: 30px;
            text-align: center;
            margin-bottom: 30px;
        }
        
        .header h1 {
            color: #ff0000;
            font-size: 2.5em;
            text-shadow: 0 0 10px #ff0000;
        }
        
        .logout-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: #000;
            color: #ff0000;
            border: 2px solid #ff0000;
            padding: 10px 20px;
            cursor: pointer;
            font-family: 'Courier New', monospace;
        }
        
        .logout-btn:hover {
            background: #ff0000;
            color: #000;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-box {
            background: #000;
            border: 2px solid #ff0000;
            padding: 25px;
            text-align: center;
        }
        
        .stat-number {
            font-size: 2.5em;
            color: #ff0000;
        }
        
        .stat-label {
            color: #aa0000;
            margin-top: 10px;
        }
        
        .section {
            background: #000;
            border: 2px solid #ff0000;
            padding: 30px;
            margin-bottom: 30px;
        }
        
        .section-title {
            color: #ff0000;
            font-size: 1.8em;
            margin-bottom: 20px;
            border-bottom: 2px solid #ff0000;
            padding-bottom: 10px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            color: #ff0000;
            margin-bottom: 8px;
            font-weight: bold;
        }
        
        input[type="text"],
        textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #ff0000;
            background: #1a0000;
            color: #ff0000;
            font-family: 'Courier New', monospace;
            font-size: 1em;
        }
        
        textarea {
            resize: vertical;
            min-height: 100px;
        }
        
        .btn {
            background: #000;
            color: #ff0000;
            border: 2px solid #ff0000;
            padding: 12px 30px;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            transition: all 0.3s;
        }
        
        .btn:hover {
            background: #ff0000;
            color: #000;
        }
        
        .project-item {
            background: #1a0000;
            border: 1px solid #ff0000;
            padding: 20px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .project-info h4 {
            color: #ff0000;
            margin-bottom: 5px;
        }
        
        .project-info p {
            color: #aa0000;
            font-size: 0.9em;
        }
        
        .btn-delete {
            background: #ff0000;
            color: #000;
        }
        
        .success-msg {
            background: #1a0000;
            border: 2px solid #00ff00;
            color: #00ff00;
            padding: 15px;
            margin-bottom: 20px;
            display: none;
        }
    </style>
</head>
<body>
    <!-- LOGIN SCREEN -->
    <div id="loginScreen">
        <h1>ADMIN ACCESS</h1>
        <p style="color: #aa0000; margin-bottom: 30px;">Enter password to continue</p>
        <input type="password" 
               id="passwordInput" 
               class="login-input" 
               placeholder="PASSWORD"
               onkeypress="if(event.key==='Enter') login()">
        <br>
        <button class="login-btn" onclick="login()">LOGIN</button>
        <p id="errorMsg" class="error-msg">INVALID PASSWORD</p>
    </div>

    <!-- ADMIN PANEL -->
    <div id="adminPanel">
        <button class="logout-btn" onclick="logout()">LOGOUT</button>
        
        <div class="container">
            <div class="header">
                <h1>ADMIN DASHBOARD</h1>
                <p style="color: #aa0000; margin-top: 10px;">System Control Panel</p>
            </div>
            
            <div id="successMsg" class="success-msg"></div>
            
            <div class="stats-grid">
                <div class="stat-box">
                    <div class="stat-number" id="totalProjects">0</div>
                    <div class="stat-label">PROJECTS</div>
                </div>
                <div class="stat-box">
                    <div class="stat-number" id="totalLinks">0</div>
                    <div class="stat-label">LINKS</div>
                </div>
                <div class="stat-box">
                    <div class="stat-number" id="totalVisits">0</div>
                    <div class="stat-label">VISITS</div>
                </div>
                <div class="stat-box">
                    <div class="stat-number" id="completedProjects">0</div>
                    <div class="stat-label">COMPLETED</div>
                </div>
            </div>
            
            <div class="section">
                <h2 class="section-title">ADD NEW PROJECT</h2>
                <form id="addProjectForm">
                    <div class="form-group">
                        <label>PROJECT NAME</label>
                        <input type="text" id="projectName" required>
                    </div>
                    <div class="form-group">
                        <label>DESCRIPTION</label>
                        <textarea id="projectDescription" required></textarea>
                    </div>
                    <div class="form-group">
                        <label>TECH STACK</label>
                        <input type="text" id="projectTech" placeholder="HTML, CSS, JavaScript" required>
                    </div>
                    <div class="form-group">
                        <label>STATUS</label>
                        <input type="text" id="projectStatus" placeholder="Completed / In Progress" required>
                    </div>
                    <button type="submit" class="btn">ADD PROJECT</button>
                </form>
            </div>
            
            <div class="section">
                <h2 class="section-title">ALL PROJECTS</h2>
                <div id="projectsList"></div>
            </div>
            
            <div class="section">
                <h2 class="section-title">ADD NEW LINK</h2>
                <form id="addLinkForm">
                    <div class="form-group">
                        <label>LINK NAME</label>
                        <input type="text" id="linkName" required>
                    </div>
                    <div class="form-group">
                        <label>URL</label>
                        <input type="text" id="linkUrl" placeholder="https://..." required>
                    </div>
                    <button type="submit" class="btn">ADD LINK</button>
                </form>
            </div>
        </div>
    </div>

    <script>
        const API_URL = window.location.hostname === 'localhost'
            ? 'http://localhost:5000/api'
            : 'https://muaves-portfolio-api.onrender.com/api';
        
        // PASSWORD HASH (SHA-256 of "admin123")
        const CORRECT_PASSWORD_HASH = '240be518fabd2724ddb6f04eeb1da5967448d7e831c08c8fa822809f74c720a9';
        
        async function hashPassword(password) {
            const encoder = new TextEncoder();
            const data = encoder.encode(password);
            const hashBuffer = await crypto.subtle.digest('SHA-256', data);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }
        
        async function login() {
            const password = document.getElementById('passwordInput').value;
            const hash = await hashPassword(password);
            
            if (hash === CORRECT_PASSWORD_HASH) {
                sessionStorage.setItem('adminAuth', 'true');
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('adminPanel').style.display = 'block';
                loadDashboard();
            } else {
                document.getElementById('errorMsg').style.display = 'block';
                setTimeout(() => {
                    document.getElementById('errorMsg').style.display = 'none';
                }, 3000);
            }
        }
        
        function logout() {
            sessionStorage.removeItem('adminAuth');
            location.reload();
        }
        
        window.addEventListener('DOMContentLoaded', () => {
            if (sessionStorage.getItem('adminAuth') === 'true') {
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('adminPanel').style.display = 'block';
                loadDashboard();
            }
        });
        
        async function loadDashboard() {
            try {
                const response = await fetch(`${API_URL}/admin/stats`);
                const stats = await response.json();
                
                document.getElementById('totalProjects').textContent = stats.projects.total;
                document.getElementById('totalLinks').textContent = stats.links.total;
                document.getElementById('totalVisits').textContent = stats.views.total_visits;
                document.getElementById('completedProjects').textContent = stats.projects.completed;
                
                await loadAllProjects();
            } catch (error) {
                console.error('Error:', error);
            }
        }
        
        async function loadAllProjects() {
            const response = await fetch(`${API_URL}/projects`);
            const projects = await response.json();
            
            const container = document.getElementById('projectsList');
            container.innerHTML = projects.map((project, index) => `
                <div class="project-item">
                    <div class="project-info">
                        <h4>${project.name}</h4>
                        <p>${project.description}</p>
                        <p><strong>TECH:</strong> ${project.tech}</p>
                        <p><strong>STATUS:</strong> ${project.status}</p>
                    </div>
                    <button class="btn btn-delete" onclick="deleteProject(${index + 1}, '${project.name}')">DELETE</button>
                </div>
            `).join('');
        }
        
        document.getElementById('addProjectForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const project = {
                name: document.getElementById('projectName').value,
                description: document.getElementById('projectDescription').value,
                tech: document.getElementById('projectTech').value,
                status: document.getElementById('projectStatus').value
            };
            
            try {
                await fetch(`${API_URL}/projects`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(project)
                });
                
                showSuccess('PROJECT ADDED SUCCESSFULLY');
                document.getElementById('addProjectForm').reset();
                loadDashboard();
            } catch (error) {
                showSuccess('ERROR ADDING PROJECT');
            }
        });
        
        document.getElementById('addLinkForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const link = {
                name: document.getElementById('linkName').value,
                url: document.getElementById('linkUrl').value
            };
            
            try {
                await fetch(`${API_URL}/links`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(link)
                });
                
                showSuccess('LINK ADDED SUCCESSFULLY');
                document.getElementById('addLinkForm').reset();
                loadDashboard();
            } catch (error) {
                showSuccess('ERROR ADDING LINK');
            }
        });
        
        async function deleteProject(id, name) {
            if (!confirm(`Delete "${name}"?`)) return;
            
            try {
                await fetch(`${API_URL}/projects/${id}`, { method: 'DELETE' });
                showSuccess('PROJECT DELETED');
                loadDashboard();
            } catch (error) {
                showSuccess('ERROR DELETING PROJECT');
            }
        }
        
        function showSuccess(message) {
            const msg = document.getElementById('successMsg');
            msg.textContent = message;
            msg.style.display = 'block';
            setTimeout(() => msg.style.display = 'none', 3000);
        }
    </script>
</body>
</html>
